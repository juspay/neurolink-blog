name: "Build and Deploy"
on:
  push:
    branches:
      - release
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Jekyll skips future-dated posts at build time and posts publish at 10:00 IST, so a
  # push-only trigger leaves a scheduled post out until the next unrelated push.
  # Rebuild daily at 10:01 IST (04:31 UTC) to pick up whatever became due.
  schedule:
    - cron: "31 4 * * *"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3

      - name: Install dependencies
        run: |
          bundle lock --add-platform x86_64-linux
          bundle install --jobs 4

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
